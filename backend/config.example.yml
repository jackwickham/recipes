port: 3000

database:
  path: ./data/recipes.db

llm:
  # provider: google | openai
  provider: google
  models:
    # Extracting recipes from text, web pages and photos
    import: gemini-3-flash-preview
    # Chat, and the recipes it writes or rescales
    chat: gemini-3-pro-preview

