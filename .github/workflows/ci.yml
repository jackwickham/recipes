name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The unit tests import the app from source, so they cannot catch a runtime
      # asset missing from dist. Boot the built server the way production does.
      - name: Smoke test built server
        env:
          DATABASE_PATH: /tmp/ci-smoke.db
        run: |
          node backend/dist/index.js &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/tags > /dev/null; then
              echo "Server responded"
              exit 0
            fi
            if ! kill -0 $server_pid 2>/dev/null; then
              echo "Server exited during startup"
              exit 1
            fi
            sleep 1
          done

          echo "Server did not respond within 30s"
          exit 1

  push-image:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
